[workspace]
channels = ["conda-forge"]
name = "BA-term-cards"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks.compile]
args = ["output"]
cmd = "typst compile term-card.typ {{ output }} --font-path fonts --ignore-system-fonts"

[tasks]
build = { depends-on = [
    { task = "compile", args = ["term-card.pdf"] },
    { task = "compile", args = ["'term-card-{p}.png'"] },
] }

[dependencies]
typst = "=0.13.1"